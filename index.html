<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rocket</title>
<link rel="stylesheet" href="rocket.css">
</head>

<body>

<div class="header">
<h2>🚀 Rocket</h2>

<div class="wallet">
💎 <span id="balance">1000</span>
</div>
</div>


<div class="game">

<div id="stars"></div>

<div id="rocket">🚀</div>

<div id="multi">
1.00x
</div>

</div>



<div class="history">

<div>BET</div>
<div>1.25x</div>
<div>1.78x</div>
<div>2.55x</div>
<div>4.34x</div>
<div>8.96x</div>

</div>



<div class="bet">

<h2>PLACE BET</h2>

<button onclick="selectBet(10)">
💎 10
</button>

<button onclick="selectBet(50)">
💎 50
</button>

<button onclick="selectBet(100)">
💎 100
</button>


</div>



<div class="users">

<div>
🟢 زهرا
<span>💎10</span>
</div>

<div>
⚪ حیدر
<span>💎4</span>
</div>

<div>
🟠 علی
<span>💎5</span>
</div>


</div>



<div class="buttons">

<button class="start" onclick="start()">
🚀 START
</button>


<button class="cash" onclick="cash()">
💰 CASH OUT
</button>

</div>



<div id="msg"></div>



<nav>

<span>⚔️<br>PVP</span>
<span>🎮<br>GAMES</span>
<span>🚀<br>ROCKET</span>
<span>🏆<br>RANKS</span>
<span>👤<br>PROFILE</span>

</nav>



<script src="rocket.js"></script>

</body>
  </html>
