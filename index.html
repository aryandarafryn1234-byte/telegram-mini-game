<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aryantred</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    background:#11111a;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

.container{
    padding:20px;
}

.card{
    background:#171720;
    border:2px solid #7b00ff;
    border-radius:30px;
    padding:30px;
    margin:20px 0;
}

button{
    background:#8b00ff;
    color:white;
    border:0;
    padding:18px 40px;
    border-radius:25px;
    font-size:18px;
}
</style>

</head>


<body>

<div class="container">

<h1 style="color:#a000ff">
ARYANTRED
</h1>


<div class="card">

<h2>
موجودی شما
</h2>

<h1 id="balance">
در حال دریافت...
</h1>


<button onclick="addBalance()">
افزایش موجودی
</button>

</div>



<div class="card">

<h2>
🎁 Daily Gift
</h2>

<button>
دریافت
</button>

</div>



<div class="card">

<h2>
🚀 ROCKET
</h2>

<button>
شروع بازی
</button>

</div>


</div>



<script>

const tg = window.Telegram.WebApp;

tg.ready();


// گرفتن اطلاعات کاربر تلگرام
const user = tg.initDataUnsafe.user;



// ارسال کاربر به API
if(user){

fetch("https://aryantred-api.onrender.com/user", {

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id:user.id,

username:user.username || "",

first_name:user.first_name || ""

})

})

.then(res=>res.json())

.then(data=>{

console.log(data);


if(data.balance !== undefined){

document.getElementById("balance").innerText =
data.balance;

}

})

.catch(err=>{

console.log("API ERROR",err);

});

}



function addBalance(){

if(!user) return;


fetch("https://aryantred-api.onrender.com/add",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id:user.id

})

})

.then(res=>res.json())

.then(data=>{

document.getElementById("balance").innerText =
data.balance;

});

}


</script>


</body>

</html>
