<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>Rocket Mini Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#08111f; --card:#101d30; --card2:#14253b; --text:#f5f7fb;
      --muted:#8fa3bd; --accent:#35a7ff; --green:#19c37d; --red:#ff4d67;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:radial-gradient(circle at 50% 15%,#17345a 0,#08111f 48%,#050b13 100%);
      color:var(--text);font-family:Arial,sans-serif;min-height:100vh;overflow:hidden}
    .app{width:100%;max-width:560px;margin:auto;padding:12px 14px 24px;min-height:100vh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 12px}
    .brand{font-size:20px;font-weight:800}.balance{background:#14253b;border:1px solid #24405f;border-radius:20px;padding:8px 13px;font-weight:700}
    .balance span{color:#ffd166}
    .card{background:rgba(16,29,48,.94);border:1px solid #213852;border-radius:22px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
    .game{height:430px;position:relative;overflow:hidden}
    .stars{position:absolute;inset:0;background-image:
      radial-gradient(circle,#fff 1px,transparent 1.5px),radial-gradient(circle,#79b9ff 1px,transparent 1.5px);
      background-size:75px 85px,120px 130px;background-position:10px 10px,35px 50px;opacity:.38}
    .moon{position:absolute;width:90px;height:90px;border-radius:50%;right:25px;top:25px;background:#e8f2ff;box-shadow:0 0 35px rgba(190,225,255,.35)}
    .mountains{position:absolute;bottom:0;left:-10%;width:120%;height:120px;background:#07101c;
      clip-path:polygon(0 100%,0 70%,14% 38%,27% 66%,40% 25%,54% 70%,67% 34%,80% 65%,92% 30%,100% 62%,100% 100%)}
    .mult{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:52px;font-weight:900;letter-spacing:-2px}
    .status{position:absolute;top:91px;left:0;right:0;text-align:center;color:var(--muted);font-size:14px}
    #rocket{position:absolute;bottom:62px;left:50%;font-size:58px;transform:translateX(-50%) rotate(-8deg);filter:drop-shadow(0 0 13px #ffb347);transition:bottom .05s linear}
    .flame{position:absolute;bottom:36px;left:50%;font-size:28px;transform:translateX(-50%);animation:flicker .12s infinite alternate}
    @keyframes flicker{from{transform:translateX(-50%) scale(.85)}to{transform:translateX(-50%) scale(1.15)}}
    .boom{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.2);font-size:100px;opacity:0;pointer-events:none}
    .boom.show{animation:boom .55s forwards}
    @keyframes boom{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}45%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
    .controls{padding:14px;margin-top:12px}
    .betrow{display:flex;gap:10px;align-items:center}
    input{flex:1;min-width:0;background:#091524;border:1px solid #29425f;border-radius:14px;color:white;padding:14px;font-size:17px;text-align:center;outline:none}
    button{border:0;border-radius:15px;padding:14px 18px;font-size:17px;font-weight:800;color:white;cursor:pointer}
    #start{background:linear-gradient(135deg,#148cff,#4169ff);flex:1}
    #cashout{background:linear-gradient(135deg,#13b873,#0c9c62);width:100%;margin-top:10px;display:none}
    button:disabled{opacity:.45}
    .info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .stat{background:#0b1727;border-radius:15px;padding:11px;text-align:center;color:var(--muted);font-size:13px}
    .stat b{display:block;color:white;font-size:18px;margin-top:4px}
    .history{margin-top:12px;padding:14px}
    .history h3{margin:0 0 10px;font-size:16px}
    #history{display:flex;gap:7px;flex-wrap:wrap}
    .pill{padding:6px 10px;border-radius:999px;background:#19334d;color:#7fc7ff;font-size:13px}
    .pill.red{background:#3a1823;color:#ff8092}
    .note{text-align:center;color:#73879f;font-size:11px;margin-top:12px}
    .toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#17263a;border:1px solid #2b4664;padding:11px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:10}
    .toast.show{opacity:1;transform:translateX(-50%)}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">🚀 Rocket Game</div>
    <div class="balance">🪙 <span id="balance">50</span></div>
  </header>

  <section class="card game">
    <div class="stars"></div><div class="moon"></div><div class="mountains"></div>
    <div id="mult" class="mult">1.00x</div>
    <div id="status" class="status">مقدار توکن را وارد کن و شروع بزن</div>
    <div id="rocket">🚀</div><div id="flame" class="flame">🔥</div>
    <div id="boom" class="boom">💥</div>
  </section>

  <section class="card controls">
    <div class="betrow">
      <input id="bet" type="number" min="1" max="50" value="5" inputmode="numeric" placeholder="توکن">
      <button id="start">شروع بازی</button>
    </div>
    <button id="cashout">💰 برداشت امتیاز</button>
    <div class="info">
      <div class="stat">ورودی<b id="currentBet">5</b></div>
      <div class="stat">برد احتمالی<b id="potential">5.00</b></div>
    </div>
  </section>

  <section class="card history">
    <h3>نتایج اخیر</h3>
    <div id="history"><span class="pill">آماده</span></div>
  </section>
  <div class="note">این نسخه با توکن امتیازی کار می‌کند و پرداخت واقعی ندارد.</div>
</div>
<div id="toast" class="toast"></div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = id => document.getElementById(id);
  let balance = Number(localStorage.getItem("rocket_balance") || 50);
  let running = false, bet = 5, multiplier = 1, crashAt = 2, timer = null, startTime = 0;

  function save(){ localStorage.setItem("rocket_balance", String(balance)); }
  function render(){ $("balance").textContent = balance; $("currentBet").textContent = bet; $("potential").textContent = (bet*multiplier).toFixed(2); }
  function toast(t){ const x=$("toast"); x.textContent=t; x.classList.add("show"); setTimeout(()=>x.classList.remove("show"),1800); }

  function randomCrash(){
    // بیشتر بازی‌ها در محدوده پایین‌تر می‌ترکند، اما گاهی ضریب بالاتر می‌رود.
    const r = Math.random();
    return Math.max(1.05, Math.min(30, 0.98 / Math.max(.03, 1-r)));
  }

  function addHistory(value, red=false){
    const el=document.createElement("span");
    el.className="pill"+(red?" red":"");
    el.textContent=value.toFixed(2)+"x";
    $("history").prepend(el);
    while($("history").children.length>8) $("history").lastChild.remove();
  }

  function resetRocket(){
    $("rocket").style.bottom="62px";
    $("flame").style.display="block";
    $("boom").classList.remove("show");
  }

  function startGame(){
    if(running) return;
    bet = Math.floor(Number($("bet").value));
    if(!Number.isFinite(bet) || bet<1) return toast("حداقل ۱ توکن وارد کن");
    if(bet>balance) return toast("توکن کافی نیست");
    balance -= bet; save(); render();
    running=true; multiplier=1; crashAt=randomCrash(); startTime=performance.now();
    $("start").disabled=true; $("bet").disabled=true; $("cashout").style.display="block";
    $("status").textContent="🚀 موشک در حال پرواز است؛ قبل از انفجار برداشت کن!";
    $("mult").textContent="1.00x"; resetRocket();

    function loop(now){
      if(!running) return;
      const sec=(now-startTime)/1000;
      multiplier=1 + Math.pow(sec,1.45)*0.34;
      $("mult").textContent=multiplier.toFixed(2)+"x";
      $("potential").textContent=(bet*multiplier).toFixed(2);
      $("rocket").style.bottom=(62 + Math.min(275, sec*48))+"px";
      if(multiplier>=crashAt){ crash(); return; }
      timer=requestAnimationFrame(loop);
    }
    timer=requestAnimationFrame(loop);
  }

  function crash(){
    if(!running) return;
    running=false; cancelAnimationFrame(timer);
    $("flame").style.display="none"; $("boom").classList.add("show");
    $("status").textContent="💥 انفجار! این دور را از دست دادی.";
    addHistory(multiplier,true);
    $("cashout").style.display="none"; $("start").disabled=false; $("bet").disabled=false;
    render();
  }

  function cashout(){
    if(!running) return;
    running=false; cancelAnimationFrame(timer);
    const win=bet*multiplier;
    balance += win; save();
    $("status").textContent=`✅ برداشت شد: ${win.toFixed(2)} توکن`;
    addHistory(multiplier,false);
    $("cashout").style.display="none"; $("start").disabled=false; $("bet").disabled=false;
    $("flame").style.display="none"; render();
    toast("بردت به موجودی اضافه شد 🎉");
  }

  $("start").addEventListener("click",startGame);
  $("cashout").addEventListener("click",cashout);
  $("bet").addEventListener("input",()=>{ bet=Math.max(1,Math.floor(Number($("bet").value)||1)); render(); });
  render();
})();
</script>
</body>
</html>
