<script>

const tg = window.Telegram.WebApp;

tg.ready();

let user = tg.initDataUnsafe.user;


if(user){

fetch("آدرس_API_تو/user",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

id:user.id,

name:user.first_name

})

})


.then(res=>res.json())

.then(data=>{


document.getElementById("balance").innerHTML =
data.points+" ARY";


});

}


</script>
