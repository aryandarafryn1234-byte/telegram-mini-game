<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>بازی من</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f2f5f8;
      color: #222;
    }

    .game {
      margin: 60px 20px;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
    }

    h1 {
      font-size: 30px;
    }

    .score {
      font-size: 24px;
      margin: 30px 0;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 16px 35px;
      font-size: 20px;
      background: #2481cc;
      color: white;
    }

    #result {
      margin-top: 25px;
      font-size: 19px;
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>🎮 بازی من</h1>

    <div class="score">
      🪙 امتیاز:
      <span id="score">1000</span>
    </div>

    <button id="play">🎲 بازی کن</button>

    <p id="result">برای شروع روی دکمه بزن!</p>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let score = 1000;

    document.getElementById("play").onclick = function () {

      const points = Math.floor(Math.random() * 101) + 50;

      score += points;

      document.getElementById("score").textContent = score;

      document.getElementById("result").textContent =
        "🎉 " + points + " امتیاز گرفتی!";
    };
  </script>

</body>
</html>
