<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #08070d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
      padding-bottom: 100px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .balance {
      background: #171421;
      border: 1px solid #35264d;
      border-radius: 18px;
      padding: 10px 16px;
    }

    .hero {
      background: linear-gradient(145deg, #25103d, #140d20);
      border: 1px solid #5a2d82;
      border-radius: 30px;
      padding: 30px 20px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    .hero p {
      color: #bdb5c8;
      font-size: 18px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .start {
      width: 100%;
      padding: 20px;
      border-radius: 25px;
      background: #984cff;
      margin-top: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .card {
      background: #121118;
      border: 1px solid #302c39;
      border-radius: 25px;
      padding: 20px 10px;
      text-align: center;
    }

    .icon {
      font-size: 40px;
    }

    .card h3 {
      margin: 10px 0 5px;
    }

    .card p {
      color: #88838f;
      font-size: 13px;
    }

    .section-title {
      margin-top: 35px;
      font-size: 28px;
    }

    .game {
      background: #121118;
      border: 1px solid #302c39;
      border-radius: 28px;
      padding: 20px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .game-info {
      flex: 1;
    }

    .game h2 {
      margin: 0 0 8px;
    }

    .game p {
      color: #99939f;
    }

    .play {
      background: #26143b;
      border: 1px solid #7139a0;
      padding: 12px 20px;
      border-radius: 15px;
    }

    .game-icon {
      font-size: 55px;
      background: #281344;
      border-radius: 20px;
      padding: 10px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0e0d14;
      border-top: 1px solid #292532;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
    }

    .bottom button {
      background: transparent;
      font-size: 13px;
      color: #aaa;
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      .game {
        flex-direction: row;
      }

      .hero h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top">
      <h2>🎁 Gift Game</h2>
      <div class="balance">💎 <span id="coins">0</span></div>
    </div>

    <div class="hero">
      <h1>Gift Game 🎁</h1>
      <p>بازی کن، امتیاز بگیر و جایزه ببر!</p>

      <button class="start" onclick="startGame()">
        🎮 شروع بازی
      </button>
    </div>

    <div class="cards">

      <div class="card" onclick="showRanking()">
        <div class="icon">🏆</div>
        <h3>رتبه‌بندی</h3>
        <p>جدول برترین‌ها</p>
      </div>

      <div class="card" onclick="inviteFriends()">
        <div class="icon">👥</div>
        <h3>دعوت دوستان</h3>
        <p>سکه بگیر</p>
      </div>

      <div class="card" onclick="showGifts()">
        <div class="icon">🎁</div>
        <h3>هدایا</h3>
        <p>جوایز من</p>
      </div>

    </div>

    <h2 class="section-title">🎮 بازی‌ها</h2>

    <div class="game">

      <div class="game-info">
        <h2>Rocket 🚀</h2>
        <p>ضریب رو قبل از سقوط بگیر!</p>

        <button class="play" onclick="playRocket()">
          بازی کردن
        </button>
      </div>

      <div class="game-icon">🚀</div>

    </div>

    <div class="game">

      <div class="game-info">
        <h2>Gift Crash 🎁</h2>
        <p>شانس خودت رو امتحان کن!</p>

        <button class="play" onclick="playGiftCrash()">
          بازی کردن
        </button>
      </div>

      <div class="game-icon">🎁</div>

    </div>

  </div>

  <div class="bottom">
    <button onclick="showHome()">🏠<br>خانه</button>
    <button onclick="showGifts()">🎁<br>هدایا</button>
    <button onclick="inviteFriends()">👥<br>دعوت</button>
    <button onclick="showRanking()">🏆<br>برترین‌ها</button>
    <button onclick="showEarnings()">💎<br>کسب درآمد</button>
  </div>

  <script src="app.js"></script>

</body>
        </html>
