<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARY IR - انفجار</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>

    <div class="profile">
      <div class="avatar">👨🏻‍🚀</div>
      <span id="username">ARY IR</span>
    </div>

    <h1>بازی انفجار 🚀</h1>

    <button class="icon">⚙️</button>

  </header>


  <section class="top">

    <div class="balance">

      <span>موجودی شما</span>

      <strong>
        <i>★</i>
        <span id="balance">10,000</span>
      </strong>

    </div>

  </section>


  <div class="chips">

    <span class="green">2.45x</span>
    <span class="red">1.09x</span>
    <span class="green">3.21x</span>
    <span class="green">1.78x</span>
    <span class="red">1.15x</span>

  </div>


  <main class="game">

    <div class="status" id="status">
      🟢 آماده شروع
    </div>


    <div class="multiplier" id="multiplier">
      1.00x
    </div>


    <div class="sub">
      ضریب در حال افزایش است
    </div>


    <div class="rocket-wrap" id="rocket">

      <div class="rocket">
        🚀
      </div>

      <div class="flame"></div>

    </div>


    <div class="curve"></div>

  </main>


  <section class="controls">

    <div class="card">

      <label>
        مبلغ شرط
      </label>

      <div class="input">

        <i>★</i>

        <input
          id="amount"
          type="number"
          value="100"
          min="10"
        >

      </div>

      <div class="quick">

        <button onclick="addAmount(100)">
          +100
        </button>

        <button onclick="addAmount(500)">
          +500
        </button>

        <button onclick="addAmount(1000)">
          +1K
        </button>

        <button onclick="addAmount(5000)">
          +5K
        </button>

      </div>

    </div>


    <div class="card">

      <label>
        برداشت خودکار
      </label>

      <div class="input">

        <input
          id="auto"
          type="number"
          value="2"
          min="1.01"
          step="0.01"
        >

        <b>×</b>

      </div>

      <div class="quick">

        <button onclick="setAuto(1.5)">
          1.5x
        </button>

        <button onclick="setAuto(2)">
          2x
        </button>

        <button onclick="setAuto(5)">
          5x
        </button>

        <button onclick="setAuto(10)">
          10x
        </button>

      </div>

    </div>

  </section>


  <button
    class="action"
    id="action"
  >
    🚀 شرط بستن
  </button>


  <section class="history">

    <h2>
      تاریخچه بازی‌ها
    </h2>

    <div class="thead">

      <span>کاربر</span>
      <span>مبلغ</span>
      <span>ضریب</span>
      <span>نتیجه</span>

    </div>


    <div class="row">

      <span>👨🏻 Ali</span>
      <span>500 ★</span>
      <b class="green">2.45x</b>
      <b class="green">برد</b>

    </div>


    <div class="row">

      <span>👩🏻 Sara</span>
      <span>1000 ★</span>
      <b class="red">1.09x</b>
      <span>باخت</span>

    </div>


    <div class="row">

      <span>👨🏻 Reza</span>
      <span>750 ★</span>
      <b class="green">3.21x</b>
      <b class="green">برد</b>

    </div>

  </section>

</div>


<script>

function addAmount(value) {

  const input =
    document.getElementById("amount");

  input.value =
    Number(input.value || 0) + value;

}


function setAuto(value) {

  document.getElementById("auto").value =
    value;

}


// اتصال به Telegram Mini App

if (window.Telegram &&
    window.Telegram.WebApp) {

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();

  const user =
    Telegram.WebApp.initDataUnsafe.user;

  if (user) {

    document.getElementById("username")
      .textContent =
      user.first_name || "بازیکن";

  }

}

</script>

<script src="app.js"></script>

</body>
        </html>
