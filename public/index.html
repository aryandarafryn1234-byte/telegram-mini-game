<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gift Mini App</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div>
        <div class="small-title">خوش اومدی 👋</div>
        <div class="username" id="username">بازیکن</div>
      </div>

      <div class="balance">
        <span>💎</span>
        <b id="balance">0</b>
      </div>
    </header>


    <!-- Main Banner -->
    <section class="hero">
      <div class="hero-content">
        <span class="hero-icon">🎁</span>

        <div>
          <h1>Gift Game</h1>
          <p>بازی کن، امتیاز بگیر و جایزه ببر!</p>
        </div>
      </div>

      <button class="play-btn" onclick="startGame()">
        🎮 شروع بازی
      </button>
    </section>


    <!-- Quick actions -->
    <section class="quick-actions">

      <button class="action-card" onclick="showSection('gifts')">
        <span>🎁</span>
        <b>هدایا</b>
        <small>جوایز من</small>
      </button>

      <button class="action-card" onclick="showSection('invite')">
        <span>👥</span>
        <b>دعوت دوستان</b>
        <small>سکه بگیر</small>
      </button>

      <button class="action-card" onclick="showSection('leaderboard')">
        <span>🏆</span>
        <b>رتبه‌بندی</b>
        <small>جدول برترین‌ها</small>
      </button>

    </section>


    <!-- Games -->
    <section class="section">

      <div class="section-title">
        <h2>🎮 بازی‌ها</h2>
        <span>همه</span>
      </div>

      <div class="games">

        <div class="game-card" onclick="startGame()">
          <div class="game-image rocket">🚀</div>

          <div class="game-info">
            <h3>Rocket</h3>
            <p>ضریب رو قبل از سقوط بگیر!</p>

            <button>بازی کردن</button>
          </div>
        </div>


        <div class="game-card" onclick="startGame()">
          <div class="game-image gift">🎁</div>

          <div class="game-info">
            <h3>Gift Crash</h3>
            <p>شانس خودت رو امتحان کن</p>

            <button>بازی کردن</button>
          </div>
        </div>

      </div>

    </section>


    <!-- Earn -->
    <section class="earn-box">

      <div class="earn-icon">💰</div>

      <div>
        <h3>سکه بیشتر می‌خوای؟</h3>
        <p>دوستات رو دعوت کن و جایزه بگیر.</p>
      </div>

      <button onclick="showSection('invite')">
        دعوت
      </button>

    </section>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

      <button class="nav-item active" onclick="showSection('home')">
        <span>🏠</span>
        <small>خانه</small>
      </button>

      <button class="nav-item" onclick="showSection('gifts')">
        <span>🎒</span>
        <small>کوله‌پشتی</small>
      </button>

      <button class="nav-item" onclick="showSection('invite')">
        <span>👥</span>
        <small>دعوت</small>
      </button>

      <button class="nav-item" onclick="showSection('leaderboard')">
        <span>🏆</span>
        <small>برترین‌ها</small>
      </button>

      <button class="nav-item" onclick="showSection('earn')">
        <span>💎</span>
        <small>کسب درآمد</small>
      </button>

    </nav>

  </div>

  <script src="app.js"></script>

</body>
  </html>
