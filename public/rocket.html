<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocket Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #07060d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 15px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .back {
      background: #17131f;
      color: white;
      border: 1px solid #30263c;
      padding: 10px 15px;
      border-radius: 12px;
    }

    .balance {
      background: #17131f;
      border: 1px solid #30263c;
      padding: 10px 15px;
      border-radius: 12px;
      color: #c28aff;
    }

    .game {
      position: relative;
      height: 500px;
      overflow: hidden;
      border-radius: 25px;
      border: 1px solid #392653;
      background:
        radial-gradient(circle at 50% 35%, #241044, #080711 70%);
    }

    .stars {
      position: absolute;
      inset: 0;
      opacity: .6;
      font-size: 22px;
      line-height: 70px;
      word-spacing: 25px;
    }

    .multiplier {
      position: absolute;
      top: 45px;
      width: 100%;
      text-align: center;
      font-size: 58px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 25px #a44cff;
      z-index: 3;
    }

    .status {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #0b3328;
      color: #36e99a;
      padding: 9px 13px;
      border-radius: 10px;
      z-index: 4;
      font-size: 13px;
    }

    .rocket {
      position: absolute;
      left: 50%;
      bottom: 45px;
      transform: translateX(-50%) rotate(-25deg);
      font-size: 95px;
      transition: bottom .08s linear;
      filter: drop-shadow(0 0 18px #ff661f);
      z-index: 5;
    }

    .flame {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: 20px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(
        white,
        #ff9d21,
        #ff3000
      );
      filter: blur(6px);
      z-index: 4;
    }

    .explosion {
      display: none;
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      font-size: 105px;
      z-index: 10;
      animation: boom .5s ease-out;
    }

    @keyframes boom {
      from {
        transform: translate(-50%, -50%) scale(.2);
        opacity: 0;
      }

      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    .controls {
      margin-top: 15px;
      background: #111018;
      border: 1px solid #292230;
      border-radius: 20px;
      padding: 15px;
    }

    label {
      display: block;
      color: #aaa2b1;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #382d46;
      background: #090810;
      color: white;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .buttons button {
      padding: 15px;
      border-radius: 13px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      border: 0;
    }

    .start {
      background: #9b4cff;
    }

    .cash {
      background: #09a95a;
    }

    .message {
      text-align: center;
      color: #99929f;
      margin-top: 15px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <button class="back" onclick="goHome()">
      ← برگشت
    </button>

    <div class="balance">
      💎 <span id="balance">1000</span>
    </div>
  </div>


  <div class="game">

    <div class="stars">
      ✦   ·    ✧      ·   ✦
      <br>
      ·    ✦       ·      ✧
      <br>
      ✧      ·   ✦       ·
    </div>

    <div class="status" id="status">
      🟢 آماده
    </div>

    <div class="multiplier" id="multiplier">
      1.00x
    </div>

    <div class="rocket" id="rocket">
      🚀
    </div>

    <div class="flame"></div>

    <div class="explosion" id="explosion">
      💥
    </div>

  </div>


  <div class="controls">

    <label>مبلغ بازی</label>

    <input
      id="amount"
      type="number"
      min="10"
      value="100"
    >

    <div class="buttons">

      <button
        class="start"
        id="startButton"
        onclick="startGame()"
      >
        🚀 شروع
      </button>

      <button
        class="cash"
        id="cashButton"
        onclick="cashOut()"
      >
        💰 برداشت
      </button>

    </div>

    <div class="message" id="message">
      قبل از انفجار برداشت کن!
    </div>

  </div>

</div>


<script>

let balance = Number(
  localStorage.getItem("coins") || 1000
);

let playing = false;
let multiplier = 1;
let crashPoint = 0;
let timer = null;

const balanceEl =
  document.getElementById("balance");

const multiplierEl =
  document.getElementById("multiplier");

const statusEl =
  document.getElementById("status");

const rocketEl =
  document.getElementById("rocket");

const explosionEl =
  document.getElementById("explosion");

const messageEl =
  document.getElementById("message");

const startButton =
  document.getElementById("startButton");


function updateBalance() {

  balanceEl.textContent =
    balance.toLocaleString("en-US");

  localStorage.setItem(
    "coins",
    balance
  );
}


function startGame() {

  if (playing) return;

  const amount =
    Number(
      document.getElementById("amount").value
    );

  if (amount < 10) {
    messageEl.textContent =
      "حداقل مبلغ ۱۰ امتیاز است.";
    return;
  }

  if (amount > balance) {
    messageEl.textContent =
      "امتیاز کافی نداری.";
    return;
  }

  balance -= amount;
  updateBalance();

  playing = true;
  multiplier = 1;

  crashPoint =
    Number(
      (1.3 + Math.random() * 4.7)
      .toFixed(2)
    );

  rocketEl.style.bottom = "45px";
  explosionEl.style.display = "none";

  statusEl.textContent =
    "🚀 در حال پرواز";

  messageEl.textContent =
    "قبل از انفجار برداشت کن!";

  startButton.textContent =
    "🚀 در حال بازی";

  clearInterval(timer);

  timer = setInterval(() => {

    multiplier +=
      0.025 + Math.random() * 0.035;

    multiplier =
      Number(multiplier.toFixed(2));

    multiplierEl.textContent =
      multiplier.toFixed(2) + "x";

    const height =
      Math.min(
        370,
        45 + (multiplier - 1) * 90
      );

    rocketEl.style.bottom =
      height + "px";

    if (multiplier >= crashPoint) {
      crash();
    }

  }, 100);
}


function cashOut() {

  if (!playing) {
    messageEl.textContent =
      "اول بازی را شروع کن.";
    return;
  }

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const win =
    Math.floor(amount * multiplier);

  balance += win;

  updateBalance();

  clearInterval(timer);

  playing = false;

  statusEl.textContent =
    "🎉 برداشت موفق";

  messageEl.textContent =
    `بردی: ${win.toLocaleString()} امتیاز`;

  startButton.textContent =
    "🚀 شروع دوباره";
}


function crash() {

  clearInterval(timer);

  playing = false;

  statusEl.textContent =
    "💥 انفجار!";

  messageEl.textContent =
    `موشک در ${multiplier.toFixed(2)}x منفجر شد.`;

  explosionEl.style.display =
    "block";

  rocketEl.style.display =
    "none";

  startButton.textContent =
    "🚀 بازی دوباره";

  setTimeout(() => {

    explosionEl.style.display =
      "none";

    rocketEl.style.display =
      "block";

    rocketEl.style.bottom =
      "45px";

    multiplierEl.textContent =
      "1.00x";

    statusEl.textContent =
      "🟢 آماده";

  }, 1500);
}


function goHome() {

  window.location.href =
    "index.html";
}


updateBalance();

</script>

</body>
  </html>
