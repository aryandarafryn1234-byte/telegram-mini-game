<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rocket Gift Game</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:#05040b;
  color:#fff;
  font-family:Arial,Tahoma,sans-serif;
}

.app{
  width:100%;
  max-width:540px;
  margin:auto;
  padding:14px;
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.top button,
.balance{
  background:#11101b;
  color:white;
  border:1px solid #3b3150;
  border-radius:15px;
  padding:11px 15px;
  font-size:15px;
}

.balance{
  color:#fff;
}

.balance span{
  color:#c77dff;
  font-weight:bold;
}

/* GAME */
.game{
  height:570px;
  position:relative;
  overflow:hidden;
  border-radius:28px;
  border:1px solid #3b2260;

  background:
    radial-gradient(circle at 50% 30%,#24104c 0%,#100a21 40%,#05040b 82%);
}

/* stars */
.star{
  position:absolute;
  color:#fff;
  opacity:.65;
  font-size:13px;
  animation:twinkle 2s infinite alternate;
}

.s1{top:8%;left:12%}
.s2{top:17%;left:80%}
.s3{top:30%;left:20%}
.s4{top:11%;left:55%}
.s5{top:42%;left:85%}
.s6{top:52%;left:8%}
.s7{top:60%;left:75%}

@keyframes twinkle{
  from{opacity:.25}
  to{opacity:1}
}

/* status */
.status{
  position:absolute;
  top:18px;
  right:18px;
  z-index:20;

  padding:9px 13px;
  border-radius:13px;

  background:#0c3025;
  color:#45efa2;
  border:1px solid #24694e;

  font-size:13px;
}

/* multiplier */
.multiplier{
  position:absolute;
  top:55px;
  width:100%;
  text-align:center;
  z-index:20;

  font-size:62px;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 0 8px #fff,
    0 0 22px #bd58ff,
    0 0 45px #8e32ff;
}

/* graph */
.graph{
  position:absolute;
  left:20px;
  right:20px;
  top:170px;
  bottom:80px;
  z-index:5;
}

.grid{
  position:absolute;
  inset:0;

  background-image:
    linear-gradient(#ffffff12 1px,transparent 1px),
    linear-gradient(90deg,#ffffff12 1px,transparent 1px);

  background-size:25% 25%;
}

/* SVG graph */
svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}

#area{
  fill:url(#gradient);
  opacity:.22;
}

#curve{
  fill:none;
  stroke:#b957ff;
  stroke-width:4;
  stroke-linecap:round;
  filter:drop-shadow(0 0 8px #a63cff);
}

.point{
  fill:#fff;
  filter:drop-shadow(0 0 6px #a63cff);
}

/* rocket */
.rocket{
  position:absolute;
  z-index:15;

  left:50%;
  bottom:75px;

  transform:translateX(-50%) rotate(-8deg);

  font-size:105px;

  filter:
    drop-shadow(0 0 10px #ff6b24)
    drop-shadow(0 0 25px #ff3d00);

  transition:bottom .1s linear;
}

/* flame */
.flame{
  position:absolute;
  z-index:12;

  left:50%;
  bottom:30px;

  transform:translateX(-50%);

  width:32px;
  height:100px;

  border-radius:50% 50% 60% 60%;

  background:
    linear-gradient(
      to bottom,
      #fff,
      #ffd43b 30%,
      #ff7518 65%,
      #ff2500
    );

  filter:blur(5px);

  animation:flame .12s infinite alternate;
}

@keyframes flame{
  from{
    height:75px;
    width:25px;
  }
  to{
    height:115px;
    width:38px;
  }
}

/* explosion */
.explosion{
  display:none;

  position:absolute;
  z-index:50;

  left:50%;
  top:48%;

  transform:translate(-50%,-50%);

  font-size:120px;

  animation:boom .5s ease-out;
}

@keyframes boom{
  0%{
    transform:translate(-50%,-50%) scale(.1);
    opacity:0;
  }
  60%{
    transform:translate(-50%,-50%) scale(1.3);
  }
  100%{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
}

/* crash line */
.crashLine{
  position:absolute;
  top:0;
  bottom:0;
  left:0;

  width:3px;

  background:#ff3d72;

  box-shadow:0 0 15px #ff3d72;

  display:none;
}

/* controls */
.controls{
  margin-top:13px;

  background:#11101a;
  border:1px solid #31273e;

  border-radius:22px;

  padding:14px;
}

.label{
  color:#aaa2b4;
  font-size:14px;
  margin-bottom:7px;
}

.amountBox{
  display:flex;
  gap:8px;
}

input{
  flex:1;

  min-width:0;

  background:#08070e;
  color:#fff;

  border:1px solid #423252;
  border-radius:13px;

  padding:14px;

  text-align:center;
  font-size:18px;

  outline:none;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:9px;
}

.quick button{
  background:#171020;
  color:#c77dff;

  border:1px solid #59367a;

  border-radius:10px;

  padding:9px 3px;
}

/* buttons */
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;

  margin-top:12px;
}

.actions button{
  border:0;
  border-radius:15px;

  padding:17px 8px;

  color:white;
  font-size:17px;
  font-weight:bold;
}

.start{
  background:linear-gradient(135deg,#8b3dff,#c45cff);
  box-shadow:0 5px 20px #8d36ff55;
}

.cash{
  background:linear-gradient(135deg,#07964c,#19c76b);
}

.cash:disabled{
  opacity:.4;
}

/* message */
.message{
  min-height:23px;

  text-align:center;

  color:#aaa1b1;

  margin-top:12px;
}

/* auto cash */
.auto{
  margin-top:12px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:12px;

  border:1px solid #30273c;
  border-radius:13px;

  color:#bdb4c5;
}

.switch{
  width:48px;
  height:25px;

  border-radius:30px;

  background:#322a3e;

  position:relative;
}

.switch:after{
  content:"";

  position:absolute;

  width:19px;
  height:19px;

  border-radius:50%;

  background:#aaa;

  top:3px;
  right:3px;

  transition:.2s;
}

.switch.active{
  background:#8d3dff;
}

.switch.active:after{
  right:26px;
  background:white;
}

/* small graph labels */
.graphLabel{
  position:absolute;
  color:#aaa;
  font-size:11px;
}

.l1{left:0;bottom:3%}
.l2{left:0;bottom:28%}
.l3{left:0;bottom:53%}
.l4{left:0;bottom:78%}

</style>
</head>

<body>

<div class="app">

  <div class="top">

    <button onclick="goHome()">
      ← برگشت
    </button>

    <div class="balance">
      💎 <span id="balance">1000</span>
    </div>

  </div>


  <div class="game">

    <!-- stars -->
    <div class="star s1">✦</div>
    <div class="star s2">✧</div>
    <div class="star s3">·</div>
    <div class="star s4">✦</div>
    <div class="star s5">✧</div>
    <div class="star s6">·</div>
    <div class="star s7">✦</div>


    <div class="status" id="status">
      🟢 آماده
    </div>


    <div class="multiplier" id="multiplier">
      1.00x
    </div>


    <!-- GRAPH -->
    <div class="graph">

      <div class="grid"></div>

      <span class="graphLabel l1">1x</span>
      <span class="graphLabel l2">2x</span>
      <span class="graphLabel l3">3x</span>
      <span class="graphLabel l4">4x</span>

      <svg viewBox="0 0 500 300" preserveAspectRatio="none">

        <defs>

          <linearGradient
            id="gradient"
            x1="0"
            y1="1"
            x2="1"
            y2="0">

            <stop
              offset="0%"
              stop-color="#8d3dff"/>

            <stop
              offset="100%"
              stop-color="#ff55d9"/>

          </linearGradient>

        </defs>

        <path
          id="area"
          d="M0,285
             C80,270 100,255 150,240
             C210,220 220,190 280,175
             C340,155 350,110 410,75
             C450,55 470,35 500,10
             L500,300 L0,300 Z"/>

        <path
          id="curve"
          d="M0,285
             C80,270 100,255 150,240
             C210,220 220,190 280,175
             C340,155 350,110 410,75
             C450,55 470,35 500,10"/>

        <circle
          class="point"
          cx="500"
          cy="10"
          r="7"/>

      </svg>

    </div>


    <!-- rocket -->
    <div class="rocket" id="rocket">
      🚀
    </div>

    <div class="flame" id="flame"></div>

    <div class="explosion" id="explosion">
      💥
    </div>

  </div>


  <!-- controls -->
  <div class="controls">

    <div class="label">
      مبلغ بازی
    </div>

    <div class="amountBox">

      <input
        id="amount"
        type="number"
        min="10"
        value="100">

    </div>


    <div class="quick">

      <button onclick="setAmount(10)">
        +10
      </button>

      <button onclick="setAmount(100)">
        +100
      </button>

      <button onclick="setAmount(500)">
        +500
      </button>

      <button onclick="setAmount(1000)">
        +1000
      </button>

    </div>


    <div class="actions">

      <button
        class="start"
        id="startButton"
        onclick="startGame()">

        🚀 شروع بازی

      </button>


      <button
        class="cash"
        id="cashButton"
        onclick="cashOut()"
        disabled>

        💰 برداشت

      </button>

    </div>


    <div class="auto">

      <span>
        برداشت خودکار
      </span>

      <div
        class="switch"
        id="autoSwitch"
        onclick="toggleAuto()">
      </div>

    </div>


    <div class="message" id="message">

      ضریب در حال افزایش است؛ قبل از انفجار برداشت کن!

    </div>

  </div>

</div>


<script>

let balance =
  Number(localStorage.getItem("coins") || 1000);

let playing = false;

let multiplier = 1;

let crashPoint = 0;

let timer = null;

let autoCash = false;

let autoValue = 2;


const balanceEl =
  document.getElementById("balance");

const multiplierEl =
  document.getElementById("multiplier");

const statusEl =
  document.getElementById("status");

const rocketEl =
  document.getElementById("rocket");

const flameEl =
  document.getElementById("flame");

const explosionEl =
  document.getElementById("explosion");

const messageEl =
  document.getElementById("message");

const startButton =
  document.getElementById("startButton");

const cashButton =
  document.getElementById("cashButton");


function updateBalance(){

  balanceEl.textContent =
    balance.toLocaleString("en-US");

  localStorage.setItem(
    "coins",
    balance
  );
}


function setAmount(value){

  document.getElementById("amount").value =
    value;
}


function toggleAuto(){

  autoCash = !autoCash;

  document
    .getElementById("autoSwitch")
    .classList.toggle("active",autoCash);

  if(autoCash){

    messageEl.textContent =
      "برداشت خودکار روی 2.00x فعال شد.";

  }else{

    messageEl.textContent =
      "برداشت خودکار خاموش شد.";

  }
}


function startGame(){

  if(playing) return;

  const amount =
    Number(
      document.getElementById("amount").value
    );


  if(amount < 10){

    messageEl.textContent =
      "حداقل مبلغ 10 امتیاز است.";

    return;
  }


  if(amount > balance){

    messageEl.textContent =
      "امتیاز کافی نداری.";

    return;
  }


  balance -= amount;

  updateBalance();


  playing = true;

  multiplier = 1;


  /*
   * ضریب انفجار تصادفی
   * بین 1.20 تا حدود 6
   */

  crashPoint =
    Number(
      (
        1.2 +
        Math.random() * 4.8
      ).toFixed(2)
    );


  rocketEl.style.bottom =
    "75px";

  rocketEl.style.transform =
    "translateX(-50%) rotate(-8deg)";

  explosionEl.style.display =
    "none";


  statusEl.textContent =
    "🚀 در حال پرواز";


  startButton.textContent =
    "🚀 بازی در حال اجرا";

  cashButton.disabled = false;


  messageEl.textContent =
    "موشک بالا میره... حواست به ضریب باشه!";


  clearInterval(timer);


  timer = setInterval(()=>{

    multiplier +=
      0.025 +
      Math.random() * 0.045;


    multiplier =
      Number(
        multiplier.toFixed(2)
      );


    multiplierEl.textContent =
      multiplier.toFixed(2) + "x";


    /*
     * بالا رفتن راکت
     */

    const rocketHeight =
      Math.min(
        430,
        75 +
        (multiplier - 1) * 75
      );


    rocketEl.style.bottom =
      rocketHeight + "px";


    /*
     * کمی چرخش راکت
     */

    const angle =
      -8 -
      Math.min(
        18,
        (multiplier - 1) * 3
      );


    rocketEl.style.transform =
      `translateX(-50%) rotate(${angle}deg)`;


    /*
     * برداشت خودکار
     */

    if(
      autoCash &&
      multiplier >= autoValue
    ){

      cashOut();

      return;
    }


    /*
     * انفجار
     */

    if(multiplier >= crashPoint){

      crash();

    }

  },100);

}


function cashOut(){

  if(!playing){

    messageEl.textContent =
      "اول بازی را شروع کن.";

    return;
  }


  const amount =
    Number(
      document.getElementById("amount").value
    );


  const win =
    Math.floor(
      amount * multiplier
    );


  balance += win;

  updateBalance();


  clearInterval(timer);

  playing = false;

  cashButton.disabled = true;


  statusEl.textContent =
    "🎉 برداشت موفق";


  messageEl.textContent =
    `🎉 ${win.toLocaleString()} امتیاز گرفتی (${multiplier.toFixed(2)}x)`;


  startButton.textContent =
    "🚀 بازی دوباره";

}


function crash(){

  clearInterval(timer);

  playing = false;

  cashButton.disabled = true;


  statusEl.textContent =
    "💥 انفجار!";


  messageEl.textContent =
    `💥 موشک در ضریب ${multiplier.toFixed(2)}x منفجر شد.`;


  explosionEl.style.display =
    "block";


  rocketEl.style.display =
    "none";

  flameEl.style.display =
    "none";


  startButton.textContent =
    "🚀 بازی دوباره";


  setTimeout(()=>{

    explosionEl.style.display =
      "none";

    rocketEl.style.display =
      "block";

    flameEl.style.display =
      "block";


    rocketEl.style.bottom =
      "75px";


    multiplierEl.textContent =
      "1.00x";


    statusEl.textContent =
      "🟢 آماده";


  },1600);

}


function goHome(){

  window.location.href =
    "index.html";

}


updateBalance();

</script>

</body>
  </html>
