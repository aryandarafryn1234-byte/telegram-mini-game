services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aryan
      POSTGRES_PASSWORD: aryan_password
      POSTGRES_DB: aryan_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://aryan:aryan_password@postgres:5432/aryan_app
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
