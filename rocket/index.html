<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Rocket</title>
<link rel="stylesheet" href="rocket.css">
</head>

<body>

<header>
    <h1>🚀 Rocket</h1>

    <div class="balance">
        💎 <span id="balance">1000</span>
    </div>
</header>


<div class="space">

    <div class="stars"></div>

    <div id="multiplier">1.00x</div>

    <div id="rocket">🚀</div>

</div>


<div class="history">
    <span>BET</span>
    <span>1.25x</span>
    <span>1.78x</span>
    <span>2.55x</span>
    <span>8.96x</span>
</div>


<div class="bets">

<button onclick="bet(10)">💎 10</button>
<button onclick="bet(50)">💎 50</button>
<button onclick="bet(100)">💎 100</button>

</div>


<div class="actions">

<button class="start" onclick="startGame()">
🚀 START
</button>

<button class="cash" onclick="cashOut()">
💰 CASH OUT
</button>

</div>


<div id="message"></div>


<nav>

<div>⚔️<br>PVP</div>
<div>🎮<br>GAMES</div>
<div class="active">🚀<br>ROCKET</div>
<div>🏆<br>RANKS</div>
<div>👤<br>PROFILE</div>

</nav>


<script src="rocket.js"></script>

</body>
</html>
