<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 Game Center</title>

<style>

*{
box-sizing:border-box;
font-family:tahoma,Arial;
}


body{

margin:0;

background:
linear-gradient(180deg,#050816,#111827);

color:white;

min-height:100vh;

}


.header{

padding:25px;

display:flex;

justify-content:space-between;

align-items:center;

}


.logo{

font-size:32px;

font-weight:bold;

}



.wallet{

background:#1f2937;

padding:15px 25px;

border-radius:30px;

font-size:20px;

}



.container{

padding:20px;

}



h2{

font-size:25px;

}



.games{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}



.game{

background:#172033;

border-radius:25px;

padding:25px;

text-align:center;

font-size:22px;

cursor:pointer;

transition:.2s;

border:1px solid #26334d;

}


.game:hover{

transform:scale(1.05);

background:#24324d;

}



.icon{

font-size:55px;

}



.bottom{

position:fixed;

bottom:0;

left:0;

right:0;

height:80px;

background:#111827;

display:flex;

justify-content:space-around;

align-items:center;

border-radius:30px 30px 0 0;

}


.bottom div{

text-align:center;

color:#9ca3af;

font-size:14px;

}


.active{

color:white!important;

}



</style>

</head>


<body>


<div class="header">


<div class="logo">
🎮 Game Center
</div>


<div class="wallet">

💎 1000

</div>


</div>



<div class="container">


<h2>
🔥 بازی‌ها
</h2>



<div class="games">



<div class="game" onclick="openGame('rocket')">

<div class="icon">
🚀
</div>

Rocket

</div>




<div class="game">

<div class="icon">
❌⭕
</div>

XO

</div>




<div class="game">

<div class="icon">
✊✋✌️
</div>

سنگ کاغذ قیچی

</div>




<div class="game">

<div class="icon">
🎲
</div>

Dice

</div>



<div class="game">

<div class="icon">
🪙
</div>

Coin Flip

</div>



<div class="game">

<div class="icon">
🎯
</div>

Guess

</div>



</div>


</div>




<div class="bottom">


<div>
🏠
<br>
Home
</div>


<div class="active">
🎮
<br>
Games
</div>


<div>
🏆
<br>
Ranks
</div>


<div>
👤
<br>
Profile
</div>


</div>




<script>


function openGame(game){

if(game=="rocket"){

window.location.href="rocket/";

}

}


</script>



</body>

    </html>
