<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚀 Rocket</title>

<link rel="stylesheet" href="rocket.css">

</head>


<body>


<header>

<div class="title">
🚀 Rocket
</div>

<div class="wallet">
💎 <span id="balance">1000</span>
</div>

</header>



<section class="rocket-box">


<div class="stars"></div>


<div id="multiplier">
1.00x
</div>


<div id="rocket">
🚀
</div>


<div id="message">
WAITING...
</div>


</section>





<div class="history">

<div class="x">1.20x</div>
<div class="x">2.40x</div>
<div class="x">3.90x</div>
<div class="x">6.70x</div>

</div>





<section class="bet-box">


<h2>
Place bet
</h2>



<div class="amounts">

<button onclick="selectBet(10)">
💎 10
</button>


<button onclick="selectBet(50)">
💎 50
</button>


<button onclick="selectBet(100)">
💎 100
</button>


</div>




<button id="place">
PLACE BET
</button>



<button id="cashout">
💰 CASH OUT
</button>



<div class="players">


<div>
👤 Player1 💎10
</div>

<div>
👤 Player2 💎50
</div>


<div>
👤 Player3 💎100
</div>


</div>


</section>





<nav>

<div>
🎒
<br>
Backpack
</div>


<div>
👥
<br>
Invite
</div>


<div class="active">
🏠
<br>
Home
</div>


<div>
🏆
<br>
Leaderboard
</div>


<div>
💎
<br>
Earn
</div>


</nav>





<script src="rocket.js"></script>


</body>

    </html>
