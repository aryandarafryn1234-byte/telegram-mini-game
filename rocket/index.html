<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Game</title>

<link rel="stylesheet" href="rocket.css">

</head>

<body>

<div class="app">

<header>
<h1>🚀 Rocket</h1>

<div class="balance">
💎 <span id="balance">1000</span>
</div>
</header>


<div class="space">

<div id="multiplier">1.00x</div>

<div id="rocket">
🚀
</div>

</div>


<div class="history">

<button>1.12x</button>
<button>2.45x</button>
<button>3.90x</button>
<button>7.25x</button>

</div>


<div class="bet-box">

<h2>Place bet</h2>


<div class="money">

<button onclick="setBet(10)">💎10</button>
<button onclick="setBet(50)">💎50</button>
<button onclick="setBet(100)">💎100</button>

</div>


<p>
👤 Player1 💎10
<br>
👤 Player2 💎50
<br>
👤 Player3 💎100
</p>


<button class="start" onclick="startGame()">
🚀 START
</button>


<button class="cash" onclick="cashOut()">
💰 CASH OUT
</button>


<p id="info">
Choose bet
</p>

</div>


</div>


<script src="rocket.js"></script>

</body>
</html>
