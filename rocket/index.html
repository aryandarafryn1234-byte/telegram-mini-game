<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Rocket</title>

<link rel="stylesheet" href="rocket.css">
</head>

<body>

<header>
    <h1>🚀 Rocket</h1>

    <div class="balance">
        💎 <span id="balance">1000</span>
    </div>
</header>


<div class="game">

    <div class="stars"></div>

    <div id="multiplier" class="multiplier">
        1.00x
    </div>


    <div id="rocket" class="rocket">
        🚀
    </div>

</div>



<div class="buttons">

<button class="cash" onclick="cashOut(1.12)">
1.12x
</button>

<button class="cash" onclick="cashOut(2.45)">
2.45x
</button>

<button class="cash" onclick="cashOut(3.90)">
3.90x
</button>

<button class="cash" onclick="cashOut(7.25)">
7.25x
</button>

</div>



<section class="bet">

<h2>PLACE BET</h2>


<div class="bets">

<button onclick="placeBet(10)">
💎 10
</button>

<button onclick="placeBet(50)">
💎 50
</button>

<button onclick="placeBet(100)">
💎 100
</button>

</div>


<div class="players">

<p>👤 Player1 💎10</p>
<p>👤 Player2 💎50</p>
<p>👤 Player3 💎100</p>

</div>



<button id="start">
🚀 START
</button>


<button id="cashout">
💰 CASH OUT
</button>


</section>



<script src="rocket.js"></script>

</body>
</html>
