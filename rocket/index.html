<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket</title>
<link rel="stylesheet" href="rocket.css">
</head>

<body>

<div class="app">

<header>
    <h1>🚀 Rocket</h1>

    <div class="balance">
        💎 <span id="balance">1000</span>
    </div>
</header>


<div class="space">

<div class="stars"></div>

<div id="multiplier">
1.00x
</div>

<img id="rocket" 
src="https://em-content.zobj.net/source/apple/391/rocket_1f680.png">

</div>


<div class="history">

<button>1.12x</button>
<button>2.45x</button>
<button>3.90x</button>
<button>7.25x</button>

</div>



<div class="betbox">

<h2>PLACE BET</h2>

<div>
<button onclick="bet(10)">💎 10</button>
<button onclick="bet(50)">💎 50</button>
<button onclick="bet(100)">💎 100</button>
</div>


<p>
👤 Player1 💎10
<br>
👤 Player2 💎50
<br>
👤 Player3 💎100
</p>


<button class="start" onclick="startGame()">
🚀 START
</button>

<button class="cash" onclick="cashOut()">
💰 CASH OUT
</button>

</div>



<nav>

<div>⚔️<br>PVP</div>
<div>🎮<br>Games</div>
<div class="active">🚀<br>Rocket</div>
<div>🏆<br>Ranks</div>
<div>👤<br>Profile</div>

</nav>


</div>


<script src="rocket.js"></script>

</body>
</html>
